name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: standards-and-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js for Pyright
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14.10

      - name: Install dependencies
        run: uv sync --locked

      - name: Check standards, policy, formatting, types, tests, and installed artifacts
        run: make ci

      - name: Prove a clean Git installation of this revision
        env:
          PACKAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          install_root=$(mktemp -d)
          trap 'rm -rf "$install_root"' EXIT
          uv venv --seed --python 3.14.10 "$install_root/venv"
          "$install_root/venv/bin/python" -m pip install --no-cache-dir \
            "nox-tach @ git+https://github.com/noxala/nox-tach.git@$PACKAGE_REF"
          cd "$install_root"
          env -u PYTHONPATH "$install_root/venv/bin/python" -I -m nox_tach --help
          env -u PYTHONPATH "$install_root/venv/bin/nox-tach" --help

  ci-gate:
    name: ci-gate
    needs: [checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI dependency to succeed
        env:
          DEPENDENCY_RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          if [[ -z "$DEPENDENCY_RESULTS" ]]; then
            echo "No CI results were provided."
            exit 1
          fi
          for result in $DEPENDENCY_RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "CI dependency did not succeed: $result"
              exit 1
            fi
          done
