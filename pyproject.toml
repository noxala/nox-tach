[project]
name = "nox-tach"
version = "0.1.2"
description = "Shared Tach policy tooling"
readme = "README.md"
requires-python = ">=3.14.10,<3.15"
dependencies = []

[project.scripts]
nox-tach = "nox_tach.runner:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nox_tach"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/dev", "/README.md", "/docs", "/pyproject.toml"]

[dependency-groups]
dev = [
    "nox-python-standards==0.2.1",
    "ruff==0.15.14",
    "pyright==1.1.411",
    "pre-commit>=4.6.0",
    "pytest==9.0.3",
    "tach>=0.35.0",
]

[tool.uv]
required-version = ">=0.13.6"
default-groups = ["dev"]
package = true

[tool.nox-python-standards]
sources = ["src", "dev"]
dependency-group = "dev"

[tool.nox-python-standards.ruff]
authorized_version = "v0.15.14"

# Shared values are copied here by explicit nox-py-standards sync.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "dev"]
exclude = [".venv", "build", "dist", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv", "build", "dist"]
required-version = "==0.15.14"
fix = false
fix-only = false
unsafe-fixes = false
line-length = 88

[tool.ruff.lint]
extend-safe-fixes = ["PT007"]
extend-unsafe-fixes = []
fixable = ["ALL"]
unfixable = []
select = ["A", "B", "DTZ", "E", "F", "I", "LOG", "N", "PGH", "PIE", "PT", "RET", "RUF", "SIM", "SLF", "T20", "UP", "W"]
ignore = []
extend-ignore = ["RET504", "SIM102", "SIM103", "SIM108", "SIM110"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
required-imports = ["from __future__ import annotations"]
# Generated from the top-level module roots in tach.toml by tach_como extensions on 2026-11-05 22:27:40 EST
known-first-party = [
    "nox_tach",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
addopts = ["-p", "no:tach"]
filterwarnings = ["error"]
